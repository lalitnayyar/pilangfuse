version: "3.9"

services:
  pilangfuse:
    build: .
    image: ${DOCKER_IMAGE_NAME:-pilangfuse}:${DOCKER_IMAGE_TAG:-latest}
    container_name: pilangfuse
    ports:
      - "${HOST_PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    volumes:
      - ./reports:/app/reports
    restart: unless-stopped
